# Weekly freshness check of the inflation forecasts (and by hand):
# scripts/check-content.js fails when even the newest forecast in
# src/content/ennusteet.json is over 4 months old, or a forecast has dropped
# off the home page because it is over 7 months old. New forecasts normally
# arrive as pull requests from the monthly content routine
# (docs/SISALTOAGENTTI.md); this is the reminder for when they do not.
# On failure: open (or comment on) a GitHub issue labelled "sisalto"; when the
# forecasts are fresh again, the open issue is closed with a comment.
name: Sisällön tuoreus

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: content-check
  cancel-in-progress: true

jobs:
  check:
    name: Tarkista ennusteiden tuoreus
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Nothing to install: the check imports only the repository's own modules.
      - name: Tarkista ennusteet
        run: node scripts/check-content.js --report "$RUNNER_TEMP/content.md"

      - name: Avaa tai päivitä issue
        if: failure()
        run: |
          {
            cat "$RUNNER_TEMP/content.md" 2>/dev/null || echo "Tarkistus epäonnistui ennen raporttia, katso ajon loki."
            echo
            echo "- Ajo: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          gh label create sisalto --color FBCA04 --description "Sisällön tuoreus (ennusteet)" 2>/dev/null || true
          number="$(gh issue list --label sisalto --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --label sisalto \
              --title "Ennusteet kaipaavat päivitystä ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Sulje issue, kun ennusteet ovat taas ajan tasalla
        if: success()
        run: |
          for number in $(gh issue list --label sisalto --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Ennusteet ovat taas ajan tasalla: $RUN_URL"
          done
