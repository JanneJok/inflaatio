# Production check every 6 hours (and by hand): https://inflaatio.fi/ answers
# with the security headers, key assets load, /healthz is up, redirects and the
# 404 page work, and the page and /data/latest.json show the latest data of
# data/meta.json on main (a data deploy that failed is noticed even when the
# next data run has nothing new to deploy). The checks are the "smoke" tests
# in test/ops.test.js.
# On failure: open (or comment on) a GitHub issue labelled "site-check";
# when the site is fine again, the open issue is closed with a comment.
name: Tuotannon tarkistus

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-check
  cancel-in-progress: true

jobs:
  check:
    name: Tarkista inflaatio.fi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://inflaatio.fi
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Second attempt after 5 minutes: a data commit may be deploying right
      # now (the page is briefly one month behind data/meta.json on main).
      - name: Savutesti tuotantoon
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if SMOKE_URL="$SITE_URL" SMOKE_EXPECT_LATEST=1 \
                node --test --test-name-pattern='^smoke' test/ops.test.js 2>&1 | tee "$RUNNER_TEMP/site-check.log"; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Epäonnistui – uusi yritys 5 minuutin kuluttua."
              sleep 300
            fi
          done
          exit 1

      - name: Avaa tai päivitä issue
        if: failure()
        run: |
          {
            echo "Automaattinen tuotannon tarkistus epäonnistui: $SITE_URL"
            echo
            echo "- Ajo: $RUN_URL"
            echo "- Aika: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Mitä tehdä: docs/OPERATIONS.md → \"Kun tuotannon tarkistus epäonnistuu\"."
            echo
            echo '<details><summary>Testitulosteen loppu</summary>'
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/site-check.log" 2>/dev/null || echo "(ei lokia)"
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/issue.md"
          gh label create site-check --color B60205 --description "Tuotannon automaattinen tarkistus" 2>/dev/null || true
          number="$(gh issue list --label site-check --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --label site-check \
              --title "Tuotannon tarkistus epäonnistui ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Sulje issue, kun sivusto toimii taas
        if: success()
        run: |
          for number in $(gh issue list --label site-check --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Tarkistus onnistui taas: $RUN_URL"
          done
