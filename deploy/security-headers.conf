# Security headers – SINGLE SOURCE (SPEC §10).
# Included by deploy/nginx.conf (server level AND every location, because nginx
# drops inherited add_header directives in a block that has its own) and parsed
# by scripts/serve.js (local server) and the tests (test/serve.test.js,
# test/ops.test.js), so keep one `add_header <Name> "<value>" always;` per line
# (`always`: also on 404/410 and other error responses).
# Consequences for all code: no inline <script> (JSON-LD is fine), no style=""
# attributes or <style> blocks, no on*= handlers, no runtime CDNs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-jPKVHX9ljZgx69o9taZ79IjAj29CX8MPrJ/jNHqYzAc=' https://www.googletagmanager.com; connect-src 'self' https://ysuhexvvgjoizrcdrxso.supabase.co https://api.emailjs.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
