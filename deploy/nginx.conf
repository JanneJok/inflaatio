# Inflaatio.fi – nginx site configuration (production on Fly.io).
#
# The Dockerfile installs this file as /etc/nginx/conf.d/inflaatio.conf, i.e.
# INSIDE the http {} block of the nginx image's main configuration, and the two
# header files as /etc/nginx/inflaatio/*.conf. nginx serves the static build
# (dist/) from /usr/share/nginx/html on port 8080 (fly.toml internal_port) as a
# non-root user. TLS terminates at Fly's proxy (and at Cloudflare in front of
# it); fly.toml force_https redirects plain HTTP before it reaches nginx.
#
# Mirrors scripts/serve.js (the local server): the same security headers
# (deploy/security-headers.conf is the single source), cache rules, MIME types,
# redirects and 404 handling. test/ops.test.js checks the parity.
#
# add_header INHERITANCE: a block that defines any add_header of its own drops
# every add_header inherited from the server level. Therefore every location
# below includes a security header file itself (and the server level has them
# too, for redirects and errors produced before a location is chosen).
#
# QUOTING: nginx turns \\ into \ (and \" \' \n \t \r into that character) and
# keeps every other backslash. So "\\\\" in a regular expression below reaches
# PCRE as \\ (a literal backslash), and "\." reaches it as \. (a dot).

# Room for the long exact keys below (must precede the map blocks).
map_hash_bucket_size 128;

# Cache-Control by final URI ($uri after index / error_page internal redirects):
# the same rules in the same order as cacheControl() in scripts/serve.js. The
# first matching regular expression wins.
map $uri $inflaatio_cache_control {
    default                                       "no-cache";
    "~^/(assets|fonts)/"                          "public, max-age=31536000, immutable";
    "~(/|\.html)$"                                "no-cache";
    "~^/data/"                                    "public, max-age=3600";
    "~^/og/"                                      "public, max-age=86400";
    "~*\.(png|jpe?g|gif|webp|avif|svg|ico)$"      "public, max-age=604800";
}

# Permanent redirects from URLs of the previous site (GitHub Pages, until 2026)
# to the new routes. GitHub Pages also answered the extensionless form
# (/terms-of-use). /index.html (and any …/index.html) is handled separately
# with $request_uri below, because the index directive redirects to it
# internally.
map $uri $inflaatio_redirect {
    default                                                        "";
    /terms-of-use.html                                             /kayttoehdot/;
    /terms-of-use                                                  /kayttoehdot/;
    /image/favicon.ico                                             /favicon.ico;
    /image/favicon.webp                                            /icons/favicon-32x32.png;
    "~^/image/((favicon-(16x16|32x32)|apple-touch-icon|android-chrome-(192x192|512x512))\.png)$"  /icons/$1;
    /image/file_00000000fbbc6246b29f5252e8021c2a.webp              /og/inflaatio.png;
}

# Files of the previous site that were public by mistake (development scripts,
# backups, planning documents; review OPS-2/X-8): 410 Gone, so search engines
# drop them quickly. The 404 page is the response body. Never list a path the
# new site uses.
map $uri $inflaatio_gone {
    # volatile: evaluate again after error_page's internal redirect to
    # /404.html. A cached 1 would make that redirect return 410 once more,
    # and nginx would then send its built-in "410 Gone" page instead of ours.
    volatile;
    default                                                        0;
    "~^/(docs|scripts|node_modules|image)/"                        1;
    "~^/[^/]+\.(md|py|backup|toml)$"                               1;
    "~^/(index\.html\.backup|inflation-site-optimized[^/]*|cookie-consent\.(css|js)|terms-of-use\.css|related-articles-component\.html|build\.js|fetch-tilastokeskus\.js|calculate_yearly_averages\.js|update-[^/]+\.js|test-[^/]+\.js|package(-lock)?\.json|Dockerfile|CNAME|_headers|_config\.yml|SEO-CHECKLIST\.html|UPDATE_DATA_README\.html)$"  1;
}

# The app's own address https://<app>.fly.dev answers every request as well
# (the smoke tests need it), but it must not be indexed as a copy of
# inflaatio.fi. An empty value means that add_header sends no header at all.
map $host $inflaatio_robots {
    default                                       "";
    "~\.fly\.dev$"                                "noindex, nofollow";
}

# The path the visitor asked for, without the query string. $uri would log the
# internal target instead ("/index.html" for every page, "/404.html" for every
# miss).
map $request_uri $inflaatio_log_path {
    default                                       "-";
    "~^(?<inflaatio_path>[^?]*)"                  $inflaatio_path;
}

# Access log without IP addresses, user agents, referrers or query strings
# (data minimisation; nginx only sees Fly's proxy address anyway).
log_format inflaatio '$time_iso8601 $status $request_method "$inflaatio_log_path" $body_bytes_sent $request_time';

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative Location headers ("/hinnat/"), never "http://host:8080/hinnat/"
    # (the scheme and port behind Fly's proxy are not the public ones).
    absolute_redirect off;
    port_in_redirect off;

    access_log /dev/stdout inflaatio;
    # A missing file is an ordinary 404 in the access log, not an extra error
    # log line with the whole request line (and its query string).
    log_not_found off;

    charset utf-8;
    charset_types text/css text/javascript application/json application/manifest+json application/xml application/rss+xml text/plain text/csv;

    # MIME types: the same as MIME in scripts/serve.js. Replaces the image's
    # defaults (text/xml for .xml, no .webmanifest/.csv/.avif).
    types {
        text/html                    html;
        text/css                     css;
        text/javascript              js mjs;
        application/json             json map;
        application/manifest+json    webmanifest;
        application/xml              xml;
        application/rss+xml          rss;
        text/plain                   txt;
        text/csv                     csv;
        image/svg+xml                svg;
        image/png                    png;
        image/jpeg                   jpg jpeg;
        image/gif                    gif;
        image/webp                   webp;
        image/avif                   avif;
        image/x-icon                 ico;
        font/woff2                   woff2;
        font/woff                    woff;
        application/pdf              pdf;
    }
    default_type application/octet-stream;

    # Compression. The Dockerfile precompresses text files (gzip -9, *.gz next
    # to the original) for gzip_static; anything else is compressed on the fly.
    # gzip_proxied any: requests arrive through Fly's proxy (Via header).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/json application/manifest+json application/xml application/rss+xml text/plain text/csv image/svg+xml image/x-icon;

    # Real 404 status with the site's own page (no soft 404: nothing falls back
    # to /index.html). 410 (old files, see $inflaatio_gone) uses the same page.
    # A directory without index.html (/assets/, /fonts/ …) would be a 403 with
    # nginx's own page: it is a 404 like any other unknown path.
    error_page 404 410 /404.html;
    error_page 403 =404 /404.html;

    # Server level: responses produced before a location is chosen (the
    # redirects and 405/410 below) get the headers from here. Allow is
    # required on the 405 response (RFC 9110) and harmless on the redirects.
    include /etc/nginx/inflaatio/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag $inflaatio_robots always;
    add_header Allow "GET, HEAD" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    # /index.html → /, /hinnat/index.html → /hinnat/ (query string kept).
    # $request_uri is the original request, so the index directive's internal
    # redirect to …/index.html does not loop. A path segment before
    # index.html may not start with "/", "\" or "?": otherwise
    # "//evil.example/index.html" would become the scheme-relative
    # "Location: //evil.example/" (an open redirect; absolute_redirect is off,
    # so nginx sends the Location exactly as built here).
    if ($request_uri ~ "^((?:/[^/\\\\?][^?]*)?/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }
    if ($inflaatio_redirect) {
        return 301 $inflaatio_redirect$is_args$args;
    }
    if ($inflaatio_gone) {
        return 410;
    }

    # Liveness check for Fly (fly.toml [[http_service.checks]]), the Docker
    # HEALTHCHECK and .github/workflows/site-check.yml.
    location = /healthz {
        access_log off;
        include /etc/nginx/inflaatio/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $inflaatio_robots always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Embeddable widget: may be framed by any site (security-headers-embed.conf).
    # try_files serves the file inside THIS location (no internal redirect to
    # another location), so the embed header set applies.
    location = /upotus/ {
        include /etc/nginx/inflaatio/security-headers-embed.conf;
        add_header Cache-Control $inflaatio_cache_control always;
        add_header X-Robots-Tag $inflaatio_robots always;
        try_files /upotus/index.html =404;
    }

    # The 404 page is only served through error_page (a direct request for
    # /404.html gets the same page with status 404).
    location = /404.html {
        internal;
        include /etc/nginx/inflaatio/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $inflaatio_robots always;
    }

    # RSS feed: its own MIME type (like contentType() in scripts/serve.js).
    location = /feed.xml {
        include /etc/nginx/inflaatio/security-headers.conf;
        add_header Cache-Control $inflaatio_cache_control always;
        add_header X-Robots-Tag $inflaatio_robots always;
        types { }
        default_type application/rss+xml;
    }

    # Dotfiles and dot-directories are never served.
    location ~ /\. {
        include /etc/nginx/inflaatio/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $inflaatio_robots always;
        return 404;
    }

    # Everything else: plain static files. A directory without a trailing
    # slash gets a 301 to the slash URL (relative Location, query kept), a
    # directory with a slash serves its index.html, anything missing is a 404.
    location / {
        include /etc/nginx/inflaatio/security-headers.conf;
        add_header Cache-Control $inflaatio_cache_control always;
        add_header X-Robots-Tag $inflaatio_robots always;
    }
}

# www.inflaatio.fi → https://inflaatio.fi (only if the www record points to
# Fly; a Cloudflare redirect rule works as well, see docs/OPERATIONS.md).
server {
    listen 8080;
    server_name www.inflaatio.fi;

    server_tokens off;
    access_log /dev/stdout inflaatio;

    include /etc/nginx/inflaatio/security-headers.conf;
    add_header Cache-Control "no-cache" always;

    location / {
        include /etc/nginx/inflaatio/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 301 https://inflaatio.fi$request_uri;
    }
}
