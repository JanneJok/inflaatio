# Security headers for the embeddable widget route /upotus/ ONLY (SPEC §10).
# Identical to security-headers.conf except: frame-ancestors * (any site may
# embed the widget) and no X-Frame-Options. nginx does not inherit add_header
# into a location that has its own add_header, so the location for /upotus/
# (location = /upotus/ in deploy/nginx.conf) includes this file instead of
# security-headers.conf. test/serve.test.js and test/ops.test.js fail if the
# two files drift apart.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-jPKVHX9ljZgx69o9taZ79IjAj29CX8MPrJ/jNHqYzAc=' https://www.googletagmanager.com; connect-src 'self' https://ysuhexvvgjoizrcdrxso.supabase.co https://api.emailjs.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self'; font-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
